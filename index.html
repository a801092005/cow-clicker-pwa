<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="奶牛大亨">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cow Clicker - Milk Tycoon</title>
<style>
:root{--ink:#3c4375;--blue:#5874c8;--pink:#fcd0d7}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#87CEEB;color:#333;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(60,67,117,.15);z-index:10}
.mc{display:flex;align-items:center;gap:10px}
.mc>span{font-size:2rem}
#milk{font-size:1.5rem;font-weight:800;color:var(--ink);line-height:1.1}
#rate{font-size:.75rem;color:#667;font-weight:600}
#snd{background:#fff;border:2px solid #dde2f3;font-size:1.1rem;padding:6px 12px;border-radius:20px}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;padding:16px;overflow-y:auto;overscroll-behavior:contain;background:#f3f5fb}
.view.on{display:flex}
#farm{padding:0;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#87CEEB 0,#cdeaf6 42%,#a4e6a0 42%,#4fb67a 100%)}
.hills{position:absolute;left:0;right:0;bottom:58%;height:22%;width:100%}
.cloud{position:absolute;width:90px;height:26px;background:#fff;border-radius:26px;opacity:.92;animation:fc 45s linear infinite}
.cloud::before{content:"";position:absolute;width:42px;height:42px;background:#fff;border-radius:50%;top:-20px;left:16px}
@keyframes fc{from{transform:translateX(-130px)}to{transform:translateX(110vw)}}
#cowbox{position:relative;z-index:169;width:min(58vw,260px);cursor:pointer}
#cowbox .cw{position:relative;transform-origin:50% 100%;animation:br 3s ease-in-out infinite}
#cowbox img{width:100%;display:block;pointer-events:none;-webkit-touch-callout:none;filter:drop-shadow(0 6px 8px rgba(40,50,100,.25))}
.sh{position:absolute;left:10%;right:6%;bottom:-3%;height:7%;background:rgba(0,60,40,.25);border-radius:50%;filter:blur(4px)}
#cowbox.sq .cw{animation:sq .16s ease-out}
@keyframes br{50%{transform:scale(1.015,1.03)}}
@keyframes sq{50%{transform:scale(1.1,.88)}}
#hint{position:absolute;top:22%;z-index:300;left:0;right:0;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px rgba(30,60,60,.5);pointer-events:none;transition:opacity .4s}
.pop{position:fixed;z-index:1000;pointer-events:none;font-weight:800;font-size:1.4rem;color:var(--ink);text-shadow:0 0 6px #fff,0 0 3px #fff;animation:fu .8s ease-out forwards}
@keyframes fu{0%{opacity:1;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(-50%,-80px) scale(1.1)}}
.bell{position:absolute;font-size:2.6rem;z-index:400;cursor:pointer;animation:bf 2s ease-in-out infinite alternate;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
@keyframes bf{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-14px)}}
#fz{position:absolute;top:0;left:0;right:0;background:#f5c518;color:#8a3b00;text-align:center;font-weight:800;font-size:.85rem;padding:5px;display:none;z-index:9}
#fz.on{display:block}
.ttl{font-size:1.1rem;font-weight:700;color:#2c3550;margin-bottom:10px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border:2px solid #d7dcf0;background:#fff;border-radius:10px;font-weight:700;color:#667}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border:2px solid transparent;box-shadow:0 2px 8px rgba(60,67,117,.08);opacity:.55}
.card{--c:var(--blue)}.card.hid .ic{filter:grayscale(1) brightness(.7)}
.sp{position:absolute;translate:-50% -50%;pointer-events:none}
.sp.e{font-size:min(9vw,34px)}.sp.b{font-size:min(12vw,46px)}.sp.m{width:min(14vw,54px)}
.sp.m img{width:100%;display:block}
.si{--c:#9aa3b5;line-height:1;filter:drop-shadow(2px 0 0 var(--c)) drop-shadow(-2px 0 0 var(--c)) drop-shadow(0 2px 0 var(--c)) drop-shadow(0 -2px 0 var(--c));animation:bob 2.4s ease-in-out infinite}
.si.g{filter:drop-shadow(2px 0 0 var(--c)) drop-shadow(-2px 0 0 var(--c)) drop-shadow(0 2px 0 var(--c)) drop-shadow(0 -2px 0 var(--c)) drop-shadow(0 0 6px var(--c))}
.sp.up{animation:up .6s}
@keyframes up{40%{transform:scale(1.4)}}
#crown{--c:#9aa3b5}#crown path:first-child{stroke:var(--c)}
.lt{font-size:.65rem;color:#fff;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:800;vertical-align:middle}
@keyframes bob{50%{transform:translateY(-3px)}}
.sp.nw{animation:pin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pin{from{transform:scale(0)}to{transform:scale(1)}}
#crown{position:absolute;left:48%;top:-6%;width:28%;translate:-50% 0;rotate:-5deg;display:none;filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 2px 3px rgba(0,0,0,.3));animation:cr 2s ease-in-out infinite alternate}
@keyframes cr{to{transform:translateY(-3px)}}
#crown{overflow:visible}#crown.l6{filter:drop-shadow(0 0 8px #fff3b0) drop-shadow(0 0 5px var(--c)) drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.4)}50%{opacity:1;transform:scale(1.1)}}
.puff{position:absolute;left:30%;top:8%;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle,#fff 0,#e4e8f1 55%,rgba(228,232,241,0) 72%);opacity:0;pointer-events:none;animation:pf 2.8s ease-out forwards}
@keyframes pf{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-2.6em) scale(var(--s))}}
.say{position:absolute;left:50%;top:-6%;white-space:nowrap;font-size:12px;font-weight:800;color:var(--ink);background:#fff;padding:2px 8px;border-radius:10px;box-shadow:0 2px 6px rgba(60,67,117,.25);pointer-events:none;animation:sy 1.8s ease-out forwards}
@keyframes sy{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-36px)}}
.hop{animation:hop .55s ease-out}
@keyframes hop{30%{transform:translateY(-12px) rotate(-5deg)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
/* bucket overflow */
.foam{position:absolute;left:50%;top:8%;width:.9em;height:.32em;margin-left:-.45em;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #dfe6f5;opacity:0;pointer-events:none;animation:fm 1.8s ease-out forwards}
@keyframes fm{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.drip{position:absolute;left:50%;top:10%;width:.2em;height:.26em;margin-left:-.1em;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#fff;box-shadow:0 0 0 1px #cfd8ee;opacity:0;pointer-events:none;animation:dr 1.1s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes dr{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}50%{transform:translate(calc(var(--dx)*.6),-.7em)}100%{opacity:0;transform:translate(var(--dx),.9em)}}
.rill{position:absolute;left:64%;top:22%;width:.14em;height:0;border-radius:.1em;background:#fff;box-shadow:0 0 0 1px #cfd8ee;opacity:0;pointer-events:none;animation:rl 1.8s ease-in .3s forwards}
@keyframes rl{0%{opacity:0;height:0}20%{opacity:1}70%{opacity:1;height:.6em}100%{opacity:0;height:.6em;transform:translateY(.2em)}}
.wob{animation:wob .7s ease-in-out}
@keyframes wob{25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
/* tractor nitro */
.nos{animation:nos 1s ease-in-out}
@keyframes nos{0%{transform:translateX(0)}12%{transform:translateX(3px)}30%{transform:translateX(-9px)}45%{transform:translateX(-7px)}60%{transform:translateX(-9px)}100%{transform:translateX(0)}}
.fire{position:absolute;left:84%;top:52%;width:1.15em;height:.5em;transform-origin:0 50%;border-radius:.1em 100% 100% .1em/50%;background:linear-gradient(90deg,#fff 0,#ffe45c 22%,#ff8a1f 58%,rgba(255,60,0,0) 100%);filter:drop-shadow(0 0 4px #ff7a1a);opacity:0;pointer-events:none;animation:fr 1s ease-out forwards}
.fire::after{content:"";position:absolute;left:0;top:22%;width:55%;height:56%;border-radius:0 100% 100% 0/50%;background:linear-gradient(90deg,#fff,#7fd4ff 60%,rgba(80,160,255,0))}
@keyframes fr{0%{opacity:0;transform:scaleX(0)}10%{opacity:1;transform:scaleX(.6) scaleY(.8)}25%{transform:scaleX(1.1) scaleY(1.1)}40%{transform:scaleX(.8) scaleY(.9)}55%{transform:scaleX(1.15) scaleY(1)}75%{opacity:1;transform:scaleX(.7) scaleY(.7)}100%{opacity:0;transform:scaleX(.1)}}
.spk{position:absolute;left:92%;top:58%;width:.12em;height:.12em;border-radius:50%;background:#ffd34d;box-shadow:0 0 4px #ff8a1f;opacity:0;pointer-events:none;animation:sk .7s ease-out forwards}
@keyframes sk{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@media(prefers-reduced-motion:reduce){.si,#crown,.tw{animation:none}}
.card.ok{border-color:var(--blue);opacity:1}
.ic{width:44px;height:44px;border-radius:10px;background:#e9eefb;display:grid;place-items:center;font-size:1.5rem;flex-shrink:0}
.inf{flex:1;min-width:0}
.nm{font-weight:700;font-size:.95rem}
.ds{font-size:.75rem;color:#667;margin-top:2px}
.co{font-weight:700;color:var(--blue);font-size:.85rem;margin-top:3px}
.buy{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.buy:disabled{background:#c5cbe0}
.box{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(60,67,117,.08);margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef0f7;font-size:.9rem}
.row:last-child{border:0}
.ag{display:flex;flex-direction:column;gap:8px}
.ach{--c:#9aa3b5;display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#f3f5fb;border:2px dashed #d3d8e8}
.ach:not(.l0){background:#fff;border:2px solid var(--c)}
.ai{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--c);flex-shrink:0}
.ach.l0 .ai{background:#e3e6f2;filter:grayscale(1);opacity:.5}
.an{font-size:.9rem;display:block}.ach small{font-size:.7rem;color:#667;display:block}
.bar{height:6px;border-radius:3px;background:#e3e6f2;margin:5px 0 3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);width:0}
.lv{font-size:.72rem;font-weight:800;color:#fff;background:var(--c);padding:3px 8px;border-radius:10px;white-space:nowrap}
.ach.l0 .lv{background:#c5cbe0}
.plat{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;margin-bottom:10px;background:#f3f5fb;border:2px dashed #d3d8e8}
.plat .pi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:#e3e6f2;filter:grayscale(1);opacity:.5;flex-shrink:0}
.plat b{display:block;font-size:.95rem;color:#8a92a8}.plat small{font-size:.72rem;color:#8a92a8}
.plat.on{border:2px solid #aab6c8;background:linear-gradient(110deg,#eef2f7 0%,#fff 25%,#d8e0ea 50%,#fff 75%,#eef2f7 100%);background-size:250% 100%;animation:sh 3s linear infinite;box-shadow:0 0 14px rgba(150,170,200,.7)}
.plat.on .pi{background:linear-gradient(135deg,#fff,#c9d3e0);filter:none;opacity:1;box-shadow:0 0 8px #fff}
.plat.on b{color:#2c3550}.plat.on small{color:#556}
@keyframes sh{to{background-position:-250% 0}}
@media(prefers-reduced-motion:reduce){.plat.on{animation:none}}
.ach.l6{box-shadow:0 0 10px rgba(242,183,5,.55)}
.rst{background:#e0584b;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:700;margin-top:auto}
nav{display:flex;background:#fff;border-top:1px solid #e3e6f2;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nb{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:#8890a8;font-size:.72rem;font-weight:700}
.nb span{font-size:1.3rem}.nb.on{color:var(--blue)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.md{background:#fff;padding:22px;border-radius:16px;width:85%;max-width:320px;text-align:center}
.md h3{color:var(--ink);margin-bottom:8px}.md p{font-size:.9rem;color:#667;margin-bottom:16px;line-height:1.5}
.md button{background:var(--blue);color:#fff;border:0;padding:11px;border-radius:20px;font-weight:700;width:100%}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-16px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;opacity:0;transition:.25s;z-index:1100;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#cowbox img,.cloud{animation:none}}
#mood{position:absolute;left:70%;top:14%;font-size:1.1rem;display:none;z-index:5;pointer-events:none}
#mood.on{display:block;animation:mi .35s cubic-bezier(.3,1.6,.5,1)}
#mood>span{display:grid;place-items:center;width:2.2em;height:2.2em;background:rgba(255,255,255,.92);border:2px solid #ff9db5;border-radius:50%;box-shadow:0 2px 8px rgba(255,120,160,.4);animation:mb 1.4s ease-in-out infinite}
#mood::before,#mood::after{content:"";position:absolute;background:rgba(255,255,255,.92);border:2px solid #ff9db5;border-radius:50%}
#mood::before{width:.55em;height:.55em;left:-.35em;bottom:-.2em}#mood::after{width:.3em;height:.3em;left:-.7em;bottom:-.55em}
@keyframes mi{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes mb{50%{transform:translateY(-5px) scale(1.06)}}
.ht{position:absolute;left:50%;top:0;font-size:.7em;opacity:0;animation:ht 1.4s ease-out forwards}
@keyframes ht{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-3em) scale(1.1)}}
.licb{position:absolute;right:10px;bottom:10px;z-index:500;display:none;background:#fff;border:2px solid #ff9db5;color:#c2416c;border-radius:20px;padding:8px 14px;font-weight:800;font-size:.85rem;box-shadow:0 2px 8px rgba(60,67,117,.25)}
.licb.on{display:block}.licb:disabled{background:#ffe6ee}
#thief{position:absolute;z-index:450;translate:-50% -50%;padding:12px 12px 14px;cursor:pointer;text-align:center}
#thief .tf{display:block;font-size:2.8rem;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:thw .5s ease-in-out infinite alternate}
@keyframes thw{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-3px)}}
#thief.hit .tf{animation:thh .25s}
@keyframes thh{0%{transform:scale(1.3) rotate(0);filter:brightness(2) drop-shadow(0 0 8px #f33)}100%{transform:scale(1)}}
#thief .tt{position:absolute;left:0;right:0;top:-6px;font-size:.7rem;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#thief .hpb{height:6px;margin:2px 8px 0;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}
#thief .hpb i{display:block;height:100%;width:100%;background:#e0483f}
@media(prefers-reduced-motion:reduce){#thief .tf{animation:none}}
#thief .tt{left:50%;right:auto;transform:translateX(-50%);white-space:nowrap}
#thief.gone{pointer-events:none;animation:gone .6s ease-in forwards}
@keyframes gone{0%{transform:none;opacity:1}100%{transform:translateY(-130px) rotate(540deg) scale(.2);opacity:0}}
.slash{position:absolute;z-index:460;width:150px;height:8px;margin:-4px 0 0 -75px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,#ffe45c,transparent);box-shadow:0 0 12px #ffe45c;opacity:0;pointer-events:none;animation:sl .45s ease-out forwards}
@keyframes sl{0%{opacity:1;transform:rotate(var(--r)) scaleX(0)}40%{opacity:1;transform:rotate(var(--r)) scaleX(1.2)}100%{opacity:0;transform:rotate(var(--r)) scaleX(1.5)}}
.swb{position:absolute;left:10px;bottom:10px;z-index:500;display:none;background:#fff;border:2px solid #7a8cc8;color:#3c4375;border-radius:20px;padding:8px 14px;font-weight:800;font-size:.85rem;box-shadow:0 2px 8px rgba(60,67,117,.25)}
.swb.on{display:block}.swb:disabled{opacity:.6}
.swb.rdy{border-color:#e0483f;color:#c2281f;animation:swp .7s ease-in-out infinite alternate}
@keyframes swp{to{transform:scale(1.07)}}
@media(prefers-reduced-motion:reduce){.swb.rdy{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="mc"><span>🥛</span><div><div id="milk">0</div><div id="rate"></div></div></div>
  <button id="snd" aria-label="音效">🔊</button>
</header>
<main>
  <div id="fz"></div>
  <section class="view on" id="farm">

function save(){if(resetting)return;try{localStorage.setItem(KEY,JSON.stringify({milk:S.milk,total:S.total,clicks:S.clicks,played:S.played,mute:S.mute,bells:S.bells,fclicks:S.fclicks,cnt:S.cnt,lic:S.lic,fr:S.fr,fv:4,thieves:S.thieves,sword:S.sword,t:Date.now()}))}catch(e){}}

function load(){try{
  const o=JSON.parse(localStorage.getItem(KEY)||'null');if(!o)return;
  S.milk=o.milk||0;S.total=o.total??o.totalMilk??0;S.clicks=o.clicks??o.totalClicks??0;S.played=o.played??o.timePlayed??0;S.mute=!!(o.mute??o.audioMuted);S.bells=o.bells||0;S.fclicks=o.fclicks||0;S.thieves=o.thieves|0;S.sword=Math.min(o.sword|0,SW_MAX);S.lic=Math.min(o.lic|0,LIC_MAX);S.fr=Math.min(o.fv>=4?o.fr|0:o.fv==3?Math.floor((o.fr|0)*.5/1800):o.fv==2?o.fr|0:Math.floor((o.fr|0)/10),FR_MAX);
  const cs=Array.isArray(o.upgrades)?Object.fromEntries(o.upgrades.map(u=>[u.id,u.count])):(o.cnt||{});
  UP.forEach(u=>S.cnt[u.id]=cs[u.id]|0);
  $('#snd').textContent=S.mute?'🔇':'🔊';
  if(S.clicks>0)$('#hint').style.opacity=0;
  const away=(Date.now()-(o.t??o.lastSaveTime??Date.now()))/1000,cap=offCap(),secs=Math.min(away,cap),gain=secs*baseMps();
  if(secs>30&&gain>0){S.milk+=gain;S.total+=gain;

}catch(e){console.error(e)}}

  if(th.hits>=THIEF_HITS){thDefeat(false);return}
  thPlace()}
function thDefeat(sword){const e=th.e,st=th.stolen;th=null;S.thieves++;
  if(sword){e.classList.add('gone');setTimeout(()=>e.remove(),650)}else{e.remove();tone(523,1047,.5,'triangle',.3)}
  toast('🥷 偷奶大盜被'+(sword?'寶劍斬退':'擊退')+'了！期間偷走 '+f(st)+' 瓶牛奶');draw()}
function thTick(ts){
  if(!th)return;const dt=Math.min(.1,(ts-th.last)/1000);th.last=ts;
  if($('#farm').classList.contains('on')&&!document.hidden){
    const [W,H]=thBox(),v=Math.max(70,Math.min(130,W*.26));
    th.left-=dt;th.next-=dt;if(th.stun>0)th.stun-=dt;
    const st=S.milk*(1-Math.pow(1-THIEF_STEAL,dt));S.milk-=st;th.stolen+=st;
    if(th.left<=0){const t=th.stolen;th.e.remove();th=null;toast('🥷 大盜溜走了，一共偷走 '+f(t)+' 瓶牛奶！');tone(300,100,.4,'sawtooth',.15);draw();return}
    if(th.next<=0)thPick();
    const dx=th.tx-th.x,dy=th.ty-th.y,d=Math.hypot(dx,dy),sp=v*(th.stun>0?.3:1)*dt;
    if(d<6)thPick();else{th.x+=dx/d*Math.min(sp,d);th.y+=dy/d*Math.min(sp,d)}
    th.x=Math.max(30,Math.min(W-30,th.x));th.y=Math.max(50,Math.min(H-70,th.y));thPlace()}
  requestAnimationFrame(thTick)}
// bucket overflow + tractor nitro
const add=(e,c,st,ms)=>{const x=document.createElement('i');x.className=c;if(st)x.style.cssText=st;x.onanimationend=()=>x.remove();e.append(x);return x};
function bucketLoop(){const e=yc.bucket;if(e&&live()){
    e.classList.remove('wob');void e.offsetWidth;e.classList.add('wob');setTimeout(()=>e.classList.remove('wob'),750);
    add(e,'foam');add(e,'rill');
    for(let k=0;k<5;k++)add(e,'drip',`--dx:${((k%2?1:-1)*(.25+Math.random()*.5)).toFixed(2)}em;animation-delay:${(k*.09).toFixed(2)}s`)}
  setTimeout(bucketLoop,6000+Math.random()*6000)}
function nitroLoop(){const e=yc.machine;if(e&&live()){
    e.classList.remove('nos');void e.offsetWidth;e.classList.add('nos');setTimeout(()=>e.classList.remove('nos'),1050);
    add(e,'fire');for(let k=0;k<4;k++)add(e,'spk',`--dx:${(.6+Math.random()*.8).toFixed(2)}em;--dy:${(Math.random()*.8-.4).toFixed(2)}em;animation-delay:${(.1+k*.12).toFixed(2)}s`)}
  setTimeout(nitroLoop,8000+Math.random()*7000)}
load();yard(false);draw();loading=false;smokeLoop();calfLoop();setTimeout(bucketLoop,2500);setTimeout(nitroLoop,4500);
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
